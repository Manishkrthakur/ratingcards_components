<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive pricing component</title>

  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="bg_pattern">
    <img src="./images/bg-pattern.svg " alt="">
  </div>
 <header class="header">
  <img src="./images/pattern-circles.svg" alt=""class="header-circles">
  <h1>
    Simple, traffic-based pricing
  </h1>
  <p>Sign-up for our 30-day trial.</p>
  <p> No credit card required.</p>
 </header>
  
   

  <div class="container">

    <div class="title">
      <h4>Pageviews</h4>
      <p>$16.00/month</p>

    </div>
    
    <input type="range" name="range" id="range">
    
  
<!-- Toggle -->
<div class="toggle">
  <label class="name">Monthyl Billing</label>
  <input type="checkbox" name="checkbox" id="checkbox" class="checkbox">
  <label for="checkbox" class="label"></label>
  <div class="ball"></div>
  <label class="name">Yearly Billing <span>-25%</span></label>
</div>

<div class="botom">
  <ul>
    <li> <img src="./images/icon-check.svg" alt="">Unlimited websites</li>
    <li> <img src="./images/icon-check.svg" alt="">100% data ownership</li>
    <li> <img src="./images/icon-check.svg" alt=""> Email reports</li>
  </ul>
  
 <button class="btn">Start my trial</button>
</div>

  
  </div>
  

</body>
</html>
